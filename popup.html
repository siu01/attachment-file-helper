<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>添付ファイルかんたん操作</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="shell">
      <header class="header">
        <div class="mark" aria-hidden="true">↗</div>
        <div>
          <h1>添付ファイルかんたん操作</h1>
          <p id="page-label">このページの添付候補を確認中…</p>
        </div>
      </header>

      <section id="status" class="status" role="status">読み込み中…</section>
      <section id="bulk-actions" class="bulk-actions" hidden>
        <label for="folder-name">保存先フォルダ名</label>
        <div class="bulk-row">
          <input id="folder-name" type="text" maxlength="80" placeholder="ページ名">
          <button id="save-all" type="button">まとめて保存</button>
        </div>
      </section>
      <section id="attachment-list" class="attachment-list" aria-live="polite"></section>

      <footer class="footer">
        <span>右クリックでも同じ操作ができます</span>
        <button id="refresh" type="button">再読み込み</button>
      </footer>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
